<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Página não encontrada · Mighel Sterzk</title>
  <meta name="robots" content="noindex">
  <base href="/mighel-site/">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css?v=24">
  <script>try{const r=document.documentElement,t=localStorage.getItem('mighel-theme-v6');r.dataset.theme=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';const l=localStorage.getItem('mighel-language');r.lang=l==='en'||(!l&&!/^pt/i.test(navigator.language))?'en':'pt-BR'}catch{}</script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">
        <h1><a href="./">Mighel Sterzk</a></h1>
        <p data-i18n="role">Desenvolvedor</p>
      </div>
    </header>
    <div class="content">
    <main id="main">
      <section class="section not-found" aria-labelledby="not-found-title">
        <h2 id="not-found-title">404</h2>
        <div class="section-body">
          <p class="not-found-title" data-pt="Esta página não existe." data-en="This page does not exist.">Esta página não existe.</p>
          <p data-pt="O link pode estar errado ou a página foi removida." data-en="The link may be wrong, or the page was removed.">O link pode estar errado ou a página foi removida.</p>
          <p><a class="text-link" href="./" data-pt="Voltar para o início" data-en="Back to the home page">Voltar para o início</a></p>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <span>© 2026 Mighel Sterzk</span>
    </footer>
    </div>
  </div>
  <script>if(document.documentElement.lang==='en'){for(const e of document.querySelectorAll('[data-en]'))e.textContent=e.dataset.en;document.title='Page not found · Mighel Sterzk';document.querySelector('[data-i18n=role]').textContent='Developer'}</script>
</body>
</html>
